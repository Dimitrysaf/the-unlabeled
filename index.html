<!DOCTYPE html>
<html lang="el" class="govuk-template govuk-template--rebranded">
    
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Unlabeled</title>
    <meta name="description" content="A political blog and data initiative providing analysis, facts, and commentary rooted in evidence that mainstream media often overlooks.">
    <meta name="keywords" content="politics, political analysis, data journalism, facts, unlabeled data, evidence-based politics">
    <meta name="author" content="The Unlabeled">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://the-unlabeled.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://the-unlabeled.com">
    <meta property="og:title" content="The Unlabeled - Political Analysis & Data Journalism">
    <meta property="og:description" content="Evidence-based political analysis and data-driven insights that challenge mainstream narratives.">
    <meta property="og:image" content="https://the-unlabeled.com/favicon.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://the-unlabeled.com">
    <meta property="twitter:title" content="The Unlabeled - Political Analysis & Data Journalism">
    <meta property="twitter:description" content="Evidence-based political analysis and data-driven insights that challenge mainstream narratives.">
    <meta property="twitter:image" content="https://the-unlabeled.com/favicon.png">

    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" type="image/png" />

    <!-- GOV.UK Frontend CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/govuk-frontend@5.9.0/dist/govuk/govuk-frontend.min.css">

    <!-- EasyMDE (Markdown editor) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.20.0/dist/easymde.min.css">

    <!-- Icons (Font Awesome — kept for chart labels & share icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Project-specific overrides on top of GOV.UK -->
    <link rel="stylesheet" href="/src/style.css">

    <!-- Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
</head>

<body class="govuk-template__body">
    <script>document.body.className += ' js-enabled' + ('noModule' in HTMLScriptElement.prototype ? ' govuk-frontend-supported' : '');</script>
    <a href="#main-content" class="govuk-skip-link" data-module="govuk-skip-link">Skip to main content</a>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- Initialise GOV.UK Frontend modules (header toggle, skip link, etc.) -->
    <script type="module">
        import { initAll } from 'https://cdn.jsdelivr.net/npm/govuk-frontend@5.9.0/dist/govuk/govuk-frontend.min.js';
        document.addEventListener('DOMContentLoaded', () => {
            try { initAll(); } catch (e) { console.warn('govuk-frontend init:', e); }
        });
    </script>
</body>

</html>
